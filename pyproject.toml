[project]
name = "expctl"
version = "0.4.0"
description = "Repository-backed asynchronous experiment handoff: pinned requests in, receipts and collected results out."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xfeng01" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["slurm", "experiments", "reproducibility", "handoff", "hpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Repository = "https://github.com/xfeng01/expctl"
Changelog = "https://github.com/xfeng01/expctl/blob/main/CHANGELOG.md"

[project.scripts]
expctl = "expctl:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
