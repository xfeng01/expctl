[project]
name = "expctl"
version = "0.2.0"
description = "Repository-backed asynchronous experiment handoff: pinned requests in, receipts and collected results out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
expctl = "expctl:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"
